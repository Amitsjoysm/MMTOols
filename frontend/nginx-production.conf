server {
    listen 80;
    server_name marketautomailer.mj.publicvm.com;

    # ---------------------------
    # 🪶 ASTRO STATIC SITE
    # ---------------------------
    root /www/wwwroot/MarketAutoMailer.mj.publicvm.com;
    index index.html index.htm;

    # Serve Astro static files with proper fallback
    # This supports /about, /services, /contact etc.
    location / {
        # Try exact file, then directory with index.html, then 404
        try_files $uri $uri/index.html =404;
    }

    # ---------------------------
    # 🚀 BACKEND (FastAPI) - if needed
    # ---------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # ---------------------------
    # 🔒 SECURITY + PERFORMANCE
    # ---------------------------
    # Block access to sensitive files
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    # Let's Encrypt verification directory
    location ~ /\.well-known {
        allow all;
    }

    # Prevent executing code in .well-known
    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    # Cache static assets from Astro build
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache images
    location ~* \.(gif|jpg|jpeg|png|bmp|swf|ico|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        error_log off;
    }

    # Cache fonts and assets
    location ~* \.(js|css|woff|woff2|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        error_log off;
    }

    # ---------------------------
    # ⚙️ DEFAULT + LOGS
    # ---------------------------
    error_page 404 /404.html;
    error_page 502 /502.html;

    access_log /www/wwwlogs/marketautomailer.mj.publicvm.com.log;
    error_log  /www/wwwlogs/marketautomailer.mj.publicvm.com.error.log;

    # Optional: include any AA Panel extensions (leave as is)
    include /www/server/panel/vhost/nginx/extension/marketautomailer.mj.publicvm.com/*.conf;
}
