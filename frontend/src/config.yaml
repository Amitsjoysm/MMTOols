site:
  name: MarketMindAI
  site: 'https://marketmindai.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: 'ZBJKAanV5UxbbPphdYXbUJ2GihH2z9o2Qlu5XDbBDUU'

# Default SEO metadata
metadata:
  title:
    default: MarketMindAI - Discover & Compare AI Tools & Business Solutions
    template: '%s | MarketMindAI'
  description: "MarketMindAI is your ultimate directory for discovering, comparing, and reviewing AI tools and business solutions. Find the perfect tools for your business needs with expert insights and user reviews."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: MarketMindAI
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@marketmindai'
    site: '@marketmindai'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 12

    post:
      isEnabled: true
      permalink: '/blog/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
