site:
  name: TechResona
  site: 'https://techresona.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: false

# Default SEO metadata
metadata:
  title:
    default: TechResona - Cloud Solutions, Web Development & AI Automation Services
    template: '%s | TechResona'
  description: "TechResona provides expert cloud solutions (Azure, AWS), web development, SEO services, AI automation, and Microsoft 365/G Suite licenses in Pune, India. Transform your business with cutting-edge technology."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: TechResona
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@techresona'
    site: '@techresona'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/blog/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
