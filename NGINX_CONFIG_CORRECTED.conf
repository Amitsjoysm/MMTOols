# ❌ CURRENT CONFIG (WRONG for Astro SSR)
# Your current config serves STATIC files
# But your app uses Astro SSR which needs a Node.js server!

# ✅ CORRECTED CONFIG for FastAPI + Astro SSR

server {
    listen 80;
    server_name marketautomailer.mj.publicvm.com;

    # ---------------------------
    # 🎨 FRONTEND (Astro SSR via Node.js)
    # ---------------------------
    # CHANGED: Proxy to Node.js server instead of serving static files
    location / {
        proxy_pass http://127.0.0.1:3000;              # ← CHANGED: Proxy to Node server
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for SSR rendering
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ---------------------------
    # 🚀 BACKEND (FastAPI)
    # ---------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;            # ← CHANGED: Port 8001 (not 9000)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # ---------------------------
    # 🔒 SECURITY + PERFORMANCE
    # ---------------------------
    # Block access to sensitive files
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    # Let's Encrypt verification directory
    location ~ /\.well-known {
        allow all;
    }

    # Prevent executing code in .well-known
    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ---------------------------
    # ⚙️ DEFAULT + LOGS
    # ---------------------------
    error_page 404 /404.html;
    error_page 502 /502.html;

    access_log /www/wwwlogs/marketautomailer.mj.publicvm.com.log;
    error_log  /www/wwwlogs/marketautomailer.mj.publicvm.com.error.log;

    # Optional: include any AA Panel extensions (leave as is)
    include /www/server/panel/vhost/nginx/extension/marketautomailer.mj.publicvm.com/*.conf;
}
