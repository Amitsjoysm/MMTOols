# Nginx Configuration for MarketMindAI
# File: /etc/nginx/sites-available/marketmindai.com
# 
# Prerequisites: 
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo certbot --nginx -d marketmindai.com -d www.marketmindai.com

server {
    listen 80;
    server_name marketmindai.com www.marketmindai.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name marketmindai.com www.marketmindai.com;

    # SSL (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/marketmindai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketmindai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size (for logo uploads)
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Static files from frontend (logos/images in public folder)
    location /images/ {
        root /var/www/marketmindai/frontend/dist/client;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static assets (Astro build output)
    location /_astro/ {
        root /var/www/marketmindai/frontend/dist/client;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Favicon and static public files
    location ~* \.(ico|png|svg|webmanifest|txt)$ {
        root /var/www/marketmindai/frontend/dist/client;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri @frontend;
    }

    # Backend API routes (FastAPI on port 8001)
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        
        # CORS headers (backend handles these, but nginx adds them too for preflight)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Backend uploaded files (logos, images)
    location /uploads/ {
        alias /var/www/marketmindai/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # All other routes → Astro SSR frontend (port 4321)
    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60;
    }

    # Named location fallback
    location @frontend {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Logs
    access_log /var/log/nginx/marketmindai.access.log;
    error_log /var/log/nginx/marketmindai.error.log;
}
